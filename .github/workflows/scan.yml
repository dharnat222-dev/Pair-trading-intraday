name: Auto Pair Trading Scan

on:
  schedule:
    # દર 30 મિનિટે (સોમ-શુક્ર, સવાર 9:30 થી બપોર 3:30)
    - cron: '*/30 4-10 * * 1-5'  # UTC time (IST = UTC + 5:30)
  workflow_dispatch:              # Manual trigger (GitHub UI થી Run કરી શકો છો)

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Repository Clone કરો
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Python Setup કરો
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # Pip cache enable
      
      # 3. Dependencies Install કરો
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy statsmodels scipy
      
      # 4. Scanner Run કરો
      - name: Run Pair Scanner
        run: python main.py
        env:
          # GitHub Secrets થી API Keys (Secure)
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
      
      # 5. Results Upload કરો (v4)
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pair-signals
          path: pairs.csv
          retention-days: 7  # 7 દિવસ સુધી artifact store રહેશે
      
      # 6. (Optional) Error Log Upload
      - name: Upload error logs if any
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            *.txt